<div class="modal fade" id="spinnerModal" tabindex="-1" role="dialog" aria-labelledby="spinnerModalLabel"
	data-bs-backdrop="static" data-bs-keyboard="false" data-backdrop="static" data-keyboard="false">
	<div class="modal-dialog modal-dialog-centered" role="document">
		<div class="modal-content shadow-lg border-0" style="border-radius: 12px;">
			<div class="modal-body text-center p-4"
				style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
				<div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem; margin: 10px auto;">
					<span class="visually-hidden">Loading...</span>
				</div>
				<p class="mt-3 fw-bold text-secondary" id="spinnerModalText" style="font-size: 1.05rem;">Đang xử lý dữ liệu, vui lòng chờ...</p>
				<button type="button" class="btn btn-outline-danger btn-sm mt-3 px-4 rounded-pill" id="btnStopSpinnerAction" onclick="hideSpinnerModalSafely();">
					<i class="fa fa-stop-circle me-1"></i> Dừng thực thi
				</button>
			</div>
		</div>
	</div>
</div>
<script>
	function releaseSpinnerFocus() {
		const spinnerModal = document.getElementById('spinnerModal');
		const activeElement = document.activeElement;

		if (spinnerModal && activeElement && spinnerModal.contains(activeElement)) {
			activeElement.blur();
		}
	}

	function hideSpinnerModalSafely() {
		releaseSpinnerFocus();
		$('#spinnerModal').modal('hide');
	}

	(() => {
		const spinnerModal = document.getElementById('spinnerModal');
		if (!spinnerModal) return;

		spinnerModal.addEventListener('hide.bs.modal', releaseSpinnerFocus);
	})();
</script>
