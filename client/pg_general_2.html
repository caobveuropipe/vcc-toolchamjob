    :root {
      --brand: #00695c;
      --brand-600: #0a7f71;
      --muted: #6c757d;

    /* Reset & Basics */
    html,

      height: 100vh;

      background: var(--bg);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    *::-webkit-scrollbar {
      width: var(--scrollbar-size);
      height: var(--scrollbar-size);
    }

    *::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 10px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    /* Layout Structure */
    .app-shell {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-left: 0;
      transition: margin-left 0.3s ease;
      overflow-x: hidden;
    }

    /* Main Page Content Padding */
    .main-content {
      padding-top: calc(var(--header-h) + 0.5rem);
      padding-bottom: 0.5rem;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Table Responsive Container */
    .table-responsive {
      border-radius: 8px;
      overflow-x: hidden !important;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      height: 100vh;
      height: 100dvh;
      width: var(--sidebar-w-lg);
      background: #fff;

      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.3s ease, width 0.3s ease;

    @media (max-width: 991px) {
      .sidebar {
        transform: translateX(-100%);

      .sidebar.is-open {
        transform: translateX(0);

    @media (min-width: 992px) {
      .app-shell.is-collapsed .sidebar {
        width: var(--sidebar-w);

  <script>
    /* Bootstrap 5 ⇔ jQuery adapter */
    (function bs5JqueryModalAdapter() {
      var $ = window.jQuery; var bs = window.bootstrap;
      if (!$ || !bs) return;
      if (!$.fn.modal) {
        $.fn.modal = function (arg) {
          return this.each(function () {
            var el = this;
            var options = (typeof arg === 'object' && arg) || {};
            if (el.id === 'spinnerModal') {
              options.backdrop = 'static';
              options.keyboard = false;
            }
            var inst = bs.Modal.getInstance(el);
            if (!inst) inst = new bs.Modal(el, options);
            if (arg === 'show' || arg === undefined) inst.show();
            else if (arg === 'hide') inst.hide();
            else if (arg === 'toggle') inst.toggle();
          });
        };
      }
    })();

    // Sidebar Toggle Logic
    (function sidebarManager() {
      const shell = document.getElementById('appShell');
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');

      const toggleDesk = document.getElementById('sidebarToggleDesk');
      const toggleMob = document.getElementById('mobileToggle');
      const closeMob = document.getElementById('closeSidebar');

      // Desktop toggle
      if (toggleDesk && shell) {
        toggleDesk.addEventListener('click', () => {
          shell.classList.toggle('is-collapsed');
        });
      }

      // Mobile toggles
      function openMobileSidebar() {
        if (!sidebar || !backdrop) return;
        sidebar.classList.add('is-open');
        backdrop.classList.add('is-active');
        document.body.style.overflow = 'hidden'; // Prevent background scroll
      }

      function closeMobileSidebar() {
        if (!sidebar || !backdrop) return;
        sidebar.classList.remove('is-open');
        backdrop.classList.remove('is-active');
        document.body.style.overflow = '';
      }

      if (toggleMob) toggleMob.addEventListener('click', openMobileSidebar);
      if (closeMob) closeMob.addEventListener('click', closeMobileSidebar);
      if (backdrop) backdrop.addEventListener('click', closeMobileSidebar);

      // Auto close sidebar on mobile when window resized to desktop
      window.addEventListener('resize', () => {
        if (window.innerWidth >= 992) {
          closeMobileSidebar();
        }
      });
    })();

    // Hành vi back-to-top/bottom
    window.addEventListener('scroll', () => {
      const topBtn = document.getElementById('backToTop');
      const btmBtn = document.getElementById('backToBottom');
      const st = document.documentElement.scrollTop || document.body.scrollTop;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      if (topBtn) topBtn.style.display = st > 100 ? 'flex' : 'none';
      if (btmBtn) btmBtn.style.display = st < max - 100 ? 'flex' : 'none';
    });
    const elTop = document.getElementById('backToTop');
    if (elTop) elTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    const elBtm = document.getElementById('backToBottom');
    if (elBtm) elBtm.onclick = () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

    // Đổi style nút Xem khi bộ lọc đủ điều kiện
    const xemBtn = document.getElementById('xemHieuSuat');
    ['coChe_DropList', 'khoi_DropList', 'tuThang_DropList', 'denThang_DropList'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('change', () => {
          if (!xemBtn) return;
          const coCheVal = document.getElementById('coChe_DropList')?.value;
          const tuThangVal = document.getElementById('tuThang_DropList')?.value;
          const denThangVal = document.getElementById('denThang_DropList')?.value;
          const ok = !!(coCheVal && tuThangVal && denThangVal);
          xemBtn.classList.toggle('btn-info', ok);
          xemBtn.classList.toggle('btn-outline-info', !ok);
        });
      }
    });

    // Gắn hành vi nút Xem
    (function () {
      if (!xemBtn) return;
      const debugEl = document.getElementById('dtDebug');
      function setDebug(msg) { if (debugEl) { debugEl.textContent = msg; } }

      xemBtn.addEventListener('click', (e) => {
        const err = document.getElementById('errorMessage');

        // Alt + Click => Dựng bảng mẫu
        if (e.altKey && typeof window.pg_general_3_createTable === 'function') {
          const sample = [
            ['Họ tên', 'Team', 'Cơ chế', 'Loại cơ chế', 'Nhóm việc', 'Tên job', 'Diễn giải', 'Kết quả', 'Win/Fail', 'Hiệu suất', 'Phân quyền'],
            ['Nguyễn A', 'Team 1', 'C1', 'L1', 'Nhóm X', 'Job 1', 'Mô tả 1', 'OK', 'WIN', 100, 'ALL'],
            ['Trần B', 'Team 2', 'C2', 'L2', 'Nhóm Y', 'Job 2', 'Mô tả 2', 'OK', 'FAIL', 50, 'EDIT']
          ];
          try { window.pg_general_3_createTable(sample); setDebug('Đã dựng bảng mẫu (Alt+Xem).'); err && (err.textContent = ''); }
          catch (ex) { console.error(ex); err && (err.textContent = 'Lỗi khi dựng bảng mẫu.'); }
          return;
        }

        function destroyDataTable() {
          const $table = $('#dataTableHieuSuat');
          if ($.fn.DataTable && $.fn.DataTable.isDataTable($table)) {
            $table.DataTable().destroy();
            $table.empty();
            console.log('✅ DataTable cũ đã được hủy/xóa rỗng.');
          }
        }

        if (typeof window.pg_general_3_XemHieuSuatChiTiet === 'function') {
          try {
            destroyDataTable();
            setDebug('Đang tải dữ liệu...');
            window.pg_general_3_XemHieuSuatChiTiet();
            if (err) err.textContent = '';
          } catch (e) {
            console.error(e);
            if (err) err.textContent = 'Lỗi khi chạy pg_general_3_XemHieuSuatChiTiet(). Xem console để biết chi tiết.';
            if (window.Swal) Swal.fire({ icon: 'error', title: 'Lỗi', text: 'Không thể tải dữ liệu. Vui lòng xem console.', timer: 2600, showConfirmButton: false });
            setDebug('');
            return;
          }

          setTimeout(() => {
            const hasHead = document.querySelectorAll('#dataTableHieuSuat thead th').length;
            const hasRows = document.querySelectorAll('#dataTableHieuSuat tbody tr').length;
            if (!hasHead && !hasRows) {
              setDebug('');
            } else {
              setDebug(`Đã render: ${hasRows} dòng, ${hasHead} cột.`);
            }
          }, 400);
        } else {
          console.warn('Không tìm thấy pg_general_3_XemHieuSuatChiTiet trên window.');
          if (err) err.textContent = 'Thiếu hàm pg_general_3_XemHieuSuatChiTiet trong include(pg_general_3).';
          if (window.Swal) Swal.fire({ icon: 'info', title: 'Thiếu hàm', text: 'Vui lòng định nghĩa pg_general_3_XemHieuSuatChiTiet trong include(pg_general_3).', timer: 2600, showConfirmButton: false });
          setDebug('');
        }
      });
    })();

    // Nút xem khung
    (function () {
      const btn = document.getElementById('viewKhung');
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (typeof modal_khung_3_ShowModal === 'function') {
          modal_khung_3_ShowModal();

    /* Global Modal Reset Functionality */
    (function setupModalReset() {
      // Function to reset modal content
      function resetModalContent(modalElement) {
        const $modal = $(modalElement);

        // 1. Destroy all DataTables in the modal
        $modal.find('table').each(function () {
          if ($.fn.DataTable && $.fn.DataTable.isDataTable(this)) {
            try {
              $(this).DataTable().destroy();
              $(this).empty();
              console.log('✅ DataTable destroyed in modal:', modalElement.id);
            } catch (e) {
              console.warn('⚠️ Error destroying DataTable:', e);
            }
          }
        });

        // 2. Reset all forms
        $modal.find('form').each(function () {
          this.reset();
        });

        // 3. Reset all input fields (including those not in forms)
        $modal.find('input[type="text"], input[type="number"], input[type="email"], input[type="password"], textarea').val('');
        $modal.find('input[type="checkbox"], input[type="radio"]').prop('checked', false);
        $modal.find('input[type="file"]').val('');

        // 4. Reset all select elements (including Select2)
        $modal.find('select').each(function () {
          // Reset Select2 if initialized
          if ($(this).hasClass('select2-hidden-accessible')) {
            try {
              $(this).val(null).trigger('change');
            } catch (e) {
              console.warn('⚠️ Error resetting Select2:', e);
            }
          } else {
            // Regular select reset
            this.selectedIndex = 0;
          }
        });

        // 5. Clear dynamic content areas (common class names)
        $modal.find('.dynamic-content, .result-container, .preview-area').empty();

        // 6. Remove any error/success messages
        $modal.find('.alert, .error-message, .success-message').remove();

        // 7. Reset any custom data attributes
        $modal.removeData();

        console.log('🔄 Modal reset complete:', modalElement.id);
      }

      // Attach reset handler to all modals
      $(document).ready(function () {
        // Find all Bootstrap modals
        $('.modal').each(function () {
          const modalElement = this;

          // Use Bootstrap 5 event
          $(modalElement).on('hidden.bs.modal', function () {
            resetModalContent(modalElement);
          });
        });

        console.log('✅ Modal reset handlers attached to all modals');
      });
    })();

  </script>
