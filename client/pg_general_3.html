  //Đoạn code này dùng để ẩn cùng lúc nhiều cột. Dùng sự kiện addEventListener để ẩn các cột theo thứ tự được chọn trong tệp pg_general_2
  document.addEventListener('DOMContentLoaded', function () {
    // Lấy tất cả các mục trong dropdown menu
    var dropdownItems = document.querySelectorAll('.dropdown-item');

    // Lặp qua từng mục dropdown và thêm sự kiện click
    dropdownItems.forEach(function (item) {
      item.addEventListener('click', function () {
        var dataColumn = this.getAttribute('data-column'); // Lấy giá trị cột từ thuộc tính data-column

        if (dataColumn) {
          var columnIndex = parseInt(dataColumn); // Chuyển đổi thành số nguyên
          toggleColumn(columnIndex); // Gọi hàm ẩn/hiện cột
        } else {
          console.error('data-column attribute is missing or empty.');
        }
      });
    });
  });

  /**
   * Hàm ẩn/hiện một cột cụ thể trong bảng HTML
   * @param {number} columnIndex - Số thứ tự của cột cần ẩn/hiện (bắt đầu từ 1)
   */
  function toggleColumn(columnIndex) {
    var table = document.querySelector('table'); // Tìm bảng HTML
    if (!table) {
      console.error('Table not found!');
      return;
    }

    // Lấy tất cả các hàng (rows) trong bảng
    var rows = table.querySelectorAll('tr');

    // Duyệt qua từng hàng và ẩn/hiện cột tương ứng
    rows.forEach(function (row) {
      var cells = row.children; // Lấy tất cả các ô (td/th) trong hàng
      if (cells[columnIndex - 1]) { // Lưu ý: chỉ số mảng bắt đầu từ 0, nên trừ đi 1
        var cell = cells[columnIndex - 1];
        if (cell.style.display === 'none') {
          cell.style.display = ''; // Hiện cột
        } else {
          cell.style.display = 'none'; // Ẩn cột
        }
      }
    });
  }

  async function pg_general_1_LayDanhSachLuong(maNS_String, kyNghiemThu) {

    }

        })

        })

  function pg_general_3_LayDuLieuVaoBang() {
    console.time("Execution Time");
    var errorElement = document.getElementById("errorMessage");
    var status = document.getElementById("pg_general_2_status").value;

    if (status === "new") {
      if (errorElement) {
        errorElement.innerHTML = "Tool hiệu suất đã sẵn sàng!";
      }
      console.timeEnd("Execution Time");
      return Promise.resolve();
    }

    if ($.fn.DataTable.isDataTable('#dataTableHieuSuat')) {
      $('#dataTableHieuSuat').DataTable().destroy();
      $('#dataTableHieuSuat').empty();
    }

    var khoiSelect = document.getElementById('khoi_DropList').value;
    var dropTuThang = document.getElementById('tuThang_DropList').value;
    var dropDenThang = document.getElementById('denThang_DropList').value;
    var thangSelect = getMonthsInRange(dropTuThang, dropDenThang);
    var coCheSelect = document.getElementById('coChe_DropList').value;

    return Promise.all([
      modal_khung_3_loadKhungCoChe(coCheSelect),
      new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .pg_general_1_LayHieuSuatChiTiet(khoiSelect, coCheSelect, thangSelect);
      })
    ]).then(([_, response]) => {
      if (!response || response.length === 0) {
        if (status !== "new" && errorElement) {
          errorElement.innerHTML = "Không tìm thấy kết quả với các điều kiện bạn đang lọc!";
        }
        console.timeEnd("Execution Time");
        return response;
      }

      pg_general_3_cachedDataHieuSuat = response;
      pg_general_3_createTable(response);
      console.timeEnd("Execution Time");
      return response;
    }).catch(error => {
      console.error("Lỗi khi tải dữ liệu hiệu suất:", error);
      if (errorElement) {
        errorElement.innerHTML = "Đã xảy ra lỗi khi lấy dữ liệu!";
      }
      pg_general_3_showToast("Đã xảy ra lỗi khi lấy dữ liệu.", "error");
      console.timeEnd("Execution Time");
      throw error;
    });
  }

  //Xử lý các tháng được chọn trong khoảng từ tháng đến tháng (hỗ trợ cả Quý)
  function getMonthsInRange(tuthang, denthang) {
    // Nếu một trong hai biến là rỗng hoặc undefined, trả về giá trị của biến còn lại
    if (!tuthang) return denthang || "";
    if (!denthang) return tuthang || "";

    // Hàm chuyển đổi Quý sang tháng
    function expandQuarter(period) {
      if (!period) return period;

      // Kiểm tra nếu là Quý (Q1.2024, Q2.2024...)
      if (period.startsWith('Q')) {
        var parts = period.split('.');
        var quarter = parseInt(parts[0].substring(1)); // Lấy số quý
        var year = parseInt(parts[1]);

        // Chuyển quý thành tháng đầu và tháng cuối
        var startMonth, endMonth;
        switch (quarter) {
          case 1: startMonth = 1; endMonth = 3; break;
          case 2: startMonth = 4; endMonth = 6; break;
          case 3: startMonth = 7; endMonth = 9; break;
          case 4: startMonth = 10; endMonth = 12; break;
          default: return period;
        }

        return {
          start: `T${startMonth}.${year}`,
          end: `T${endMonth}.${year}`,
          isQuarter: true,
          quarter: quarter,
          year: year
        };
      }

      // Nếu là tháng, trả về nguyên bản
      return {
        start: period,
        end: period,
        isQuarter: false
      };
    }

    // Mở rộng quý thành tháng
    var tuThangExpanded = expandQuarter(tuthang);
    var denThangExpanded = expandQuarter(denthang);

    // Lấy tháng bắt đầu và kết thúc
    var startPeriod = tuThangExpanded.start;
    var endPeriod = denThangExpanded.end;

    var startParts = startPeriod.split('.');
    var endParts = endPeriod.split('.');

    var startMonth = parseInt(startParts[0].substring(1));
    var startYear = parseInt(startParts[1]);

    var endMonth = parseInt(endParts[0].substring(1));
    var endYear = parseInt(endParts[1]);

    var result = [];

    // 1. Thêm tất cả các THÁNG trong khoảng
    for (var year = startYear; year <= endYear; year++) {
      var monthStart = (year === startYear) ? startMonth : 1;
      var monthEnd = (year === endYear) ? endMonth : 12;

      for (var month = monthStart; month <= monthEnd; month++) {
        result.push(`T${month}.${year}`);
      }
    }

    // 2. Nếu cả 2 đều là Quý, thêm tất cả các QUÝ trong khoảng
    if (tuThangExpanded.isQuarter && denThangExpanded.isQuarter) {
      var startQ = tuThangExpanded.quarter;
      var startQYear = tuThangExpanded.year;
      var endQ = denThangExpanded.quarter;
      var endQYear = denThangExpanded.year;

      for (var year = startQYear; year <= endQYear; year++) {
        var qStart = (year === startQYear) ? startQ : 1;
        var qEnd = (year === endQYear) ? endQ : 4;

        for (var q = qStart; q <= qEnd; q++) {
          result.push(`Q${q}.${year}`);
        }
      }
    }
    // 3. Nếu chỉ "Từ" là Quý, thêm quý đó
    else if (tuThangExpanded.isQuarter) {
      result.push(`Q${tuThangExpanded.quarter}.${tuThangExpanded.year}`);
    }
    // 4. Nếu chỉ "Đến" là Quý, thêm quý đó
    else if (denThangExpanded.isQuarter) {
      result.push(`Q${denThangExpanded.quarter}.${denThangExpanded.year}`);
    }

    return result.join(';');
  }


  //Đoạn code này dùng để tạo các dropdown để chọn
  function populateDropdown(dropdownId, values) {
    // Kiểm tra nếu phần tử dropdown tồn tại
    var $dropdown = $("#" + dropdownId);
    if ($dropdown.length === 0) {
      console.error("Dropdown với ID '" + dropdownId + "' không tồn tại.");
      return;
    }

    // Kiểm tra nếu values là mảng
    if (!Array.isArray(values)) {
      console.error("Giá trị truyền vào không phải là mảng:", values);
      return;
    }

    // Xóa tất cả tùy chọn cũ
    $dropdown.empty();

    // Thêm placeholder trước khi thêm các tùy chọn mới
    let placeholderText = $dropdown.attr("title") || "Chọn một giá trị";
    $dropdown.append(new Option(placeholderText, "", false, false));

    // Thêm các tùy chọn mới nếu có giá trị
    if (values.length > 0) {
      values.forEach(function (value) {
        $dropdown.append(new Option(value, value));
      });
    }

    // Cập nhật select2 sau khi thay đổi danh sách
    if ($dropdown.hasClass("select2-hidden-accessible")) {
      $dropdown.val(null).trigger("change");
    } else {
      console.warn("Dropdown không được khởi tạo với Select2.");
    }
  }

  // Hàm kiểm tra xem có thay đổi nào chưa được lưu không
  function pg_general_3_hasUnsavedChanges() {
    // 1. Kiểm tra modal upload nhiều file (Upload Multiple)
    if (typeof uploadMultiple_filesData !== 'undefined' && Array.isArray(uploadMultiple_filesData) && uploadMultiple_filesData.length > 0) {
      console.log("⚠️ Có file trong danh sách Upload Multiple chưa lưu.");
      return true;
    }

    // 2. Kiểm tra modal upload đơn (UpDataChiTiet)
    const singleUploadStatus = document.getElementById('modal_UpDataChiTiet_2_status');
    if (singleUploadStatus && singleUploadStatus.value === 'non-save') {
      console.log("⚠️ Có dữ liệu Upload Chi Tiết chưa lưu.");
      return true;
    }

    // 3. Kiểm tra modal Tổng hợp hiệu suất (Tính chưa Ghi)
    if (typeof modal_tonghophieusuat_hasUnsavedChanges === 'function' && modal_tonghophieusuat_hasUnsavedChanges()) {
      console.log("⚠️ Có dữ liệu Tổng hợp hiệu suất chưa lưu.");
      return true;
    }

    // 4. Kiểm tra modal Khung cơ chế
    if (typeof modal_khung_hasUnsavedChanges === 'function' && modal_khung_hasUnsavedChanges()) {
      console.log("⚠️ Có dữ liệu Khung cơ chế chưa lưu.");
      return true;
    }

    // 5. Kiểm tra modal Form cập nhật
    if (typeof modal_Form_3_hasUnsavedChanges === 'function' && modal_Form_3_hasUnsavedChanges()) {
      console.log("⚠️ Có dữ liệu Form cập nhật chưa lưu.");
      return true;
    }

    return false;
  }

  var _pg3_pageReady = false;

  // Thêm sự kiện cảnh báo khi đóng tab/trình duyệt

    // Bỏ qua nếu trang chưa ready (đang trong quá trình khởi động GAS)

  /**
  * CREATE THE DATA TABLE
  * */
  /**
   * Tạo/khởi tạo DataTable với 2 cột hành động (Sửa/Xóa) ở ĐẦU bảng.
   * @param {Array[]} dataArray - Dòng đầu là headers, các dòng sau là dữ liệu.
   */


  function pg_general_3_createTable(dataArray) {
    if (!dataArray || !Array.isArray(dataArray) || dataArray.length === 0) {
      console.error("Dữ liệu không hợp lệ!");
      return;
    }

    const headers = dataArray[0];
    const tableData = dataArray.slice(1);
    const totalColumns = headers.length + 2; // +2 cột Sửa/Xóa
    const clampIndex = (i) => Math.max(0, Math.min(i, totalColumns - 1));
    const esc = (s) => String(s ?? "")
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    // ======== Sinh HTML bảng ========
    let tableHtml = `<div>
  <table class='table table-striped table-bordered' style='font-size:0.9em; width:100%' id='dataTableHieuSuat'>
    <thead><tr>
      <th scope='col' style='text-align:center;vertical-align:middle;width:50px;background-color:#ffffff;'>Sửa</th>
      <th scope='col' style='text-align:center;vertical-align:middle;width:50px;background-color:#ffffff;'>Xóa</th>`;

    // Danh sách các cột cần vừa nội dung, header xuống dòng (wrap text)
    const fitContentCols = [
      'KỲ NGHIỆM THU', 'KHỐI', 'MÃ NHÂN SỰ', 'HỌ VÀ TÊN', 'LOẠI CƠ CHẾ', 
      'ĐỘ KHÓ', 'SỐ LƯỢNG', 'KHỐI LƯỢNG CV', 'CHẤT LƯỢNG', 'TỶ LỆ HƯỞNG', 
      'HIỆU SUẤT', 'TỶ LỆ THAM GIA'
    ];
    const normFitCols = fitContentCols.map(s => s.toUpperCase());

    headers.forEach((header, colIndex) => {
      const headerUpper = String(header).trim().toUpperCase();
      const isEditableColumn = false; // Tạm thời bỏ highlight/edit các cột
      const isExpandColumn = headerUpper.startsWith("MỞ RỘNG");
      const isFitCol = normFitCols.includes(headerUpper);

      let headerStyle = 'text-align:center;vertical-align:middle;background-color:#ffffff;';
      if (isFitCol) {
        headerStyle += ' white-space:normal; word-break:normal; word-wrap:break-word; min-width:85px; max-width:130px;';
      } else {
        headerStyle += ' white-space:nowrap;';
      }

      if (isEditableColumn) {
        headerStyle += ' background-color:#e6f7ff !important;color:#1890ff;font-weight:bold;';
      } else if (isExpandColumn) {
        headerStyle += ' background-color:#fff3cd !important;color:#856404;font-weight:bold;';
      }

      tableHtml += `<th scope='col' style='${headerStyle}'>${esc(header)}</th>`;
    });

    tableHtml += `</tr></thead><tbody>`;

    // ======== Sinh các dòng dữ liệu ========
    tableData.forEach((row) => {
      const permission = row[26] || "";
      const isEditPermission = permission === "EDIT";
      const isAllPermission = permission === "ALL";

      const editDisabled = !(isEditPermission || isAllPermission) ? "disabled" : "";
      const deleteDisabled = !isAllPermission ? "disabled" : "";

      const editStyle = editDisabled ? "color:#adb5bd;cursor:not-allowed;" : "color:#1890ff;cursor:pointer;";
      const deleteStyle = deleteDisabled ? "color:#adb5bd;cursor:not-allowed;" : "color:#ff4d4f;cursor:pointer;";

      tableHtml += `<tr>`;
      // Nút Sửa
      tableHtml += `<td style="text-align:center;width:50px;">
      <button type="button" class="btn btn-light btn-sm action-btn" data-action="edit" ${editDisabled} title="Sửa"
              style="font-size:15px;${editStyle}">
        <i class="fa fa-edit"></i>
      </button>
    </td>`;
      // Nút Xóa
      tableHtml += `<td style="text-align:center;width:50px;">
      <button type="button" class="btn btn-light btn-sm action-btn" data-action="delete" ${deleteDisabled} title="Xóa"
              style="font-size:15px;${deleteStyle}">
        <i class="fa fa-trash"></i>
      </button>
    </td>`;

      // Cells dữ liệu
      headers.forEach((header, colIndex) => {
        const cellData = row[colIndex] ?? "";
        const headerUpper = String(header).trim().toUpperCase();
        const isEditableColumn = false;
        const isExpandColumn = headerUpper.startsWith("MỞ RỘNG");
        const isFitCol = normFitCols.includes(headerUpper);

        const editableAttr = isEditableColumn ? `contenteditable="true" class="editable-cell"` : "";

        let cellStyle = isFitCol ? "white-space:nowrap; text-align:center; min-width:85px;" : "min-width:150px;";
        if (isExpandColumn) {
          cellStyle += " background-color:#fffbf0;";
        }

        tableHtml += `<td style="${cellStyle}" ${editableAttr}>${esc(cellData)}</td>`;
      });

      tableHtml += `</tr>`;
    });

    tableHtml += `</tbody></table></div>`;
    $('#dataTableHieuSuat_div').html(tableHtml);

    // ======== Hành động Sửa / Xóa ========
    const $tableRoot = $('#dataTableHieuSuat_div');
    $tableRoot.off('click.actionBtn').on('click.actionBtn', '.action-btn', function () {
      if (this.disabled) return;
      const action = this.getAttribute('data-action');
      if (action === 'edit') window.modal_datachotcong_3_editRow(this);
      if (action === 'delete') window.modal_datachotcong_3_delRow(this);
    });

    window.modal_datachotcong_3_editRow = function (element) {
      //console.log("Edit row clicked");
      const row = $(element).closest('tr');
      // TODO: logic sửa cụ thể
    };

    window.modal_datachotcong_3_delRow = function (element) {
      const table = $('#dataTableHieuSuat').DataTable();
      const row = $(element).closest('tr');

      Swal.fire({
        title: 'Xác nhận xóa?',
        text: "Bạn không thể hoàn tác thao tác này!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Xóa',
        cancelButtonText: 'Hủy'
      }).then((result) => {
        if (result.isConfirmed) {
          table.row(row).remove().draw();
          const el = document.getElementById('modal_datachotcong_2_trangthaiaction');
          if (el) el.value = "Đang sửa";
          Swal.fire('Đã xóa!', 'Dòng đã được xóa khỏi bảng.', 'success');
        }
      });
    };

    // ======== Order mặc định ========
    const safeOrder = [[11, 'asc'], [5, 'asc'], [3, 'asc']]
      .filter(o => Array.isArray(o) && o.length >= 2)
      .map(([i, dir]) => [clampIndex(i), (dir === 'desc' ? 'desc' : 'asc')]);

    // ======== DataTable init ========
    const dt = $('#dataTableHieuSuat').DataTable({
      destroy: true,
      responsive: false,
      scrollY: 'calc(100vh - 240px)',
      scrollX: true,
      scrollCollapse: true,
      stateSave: true,
      select: true,
      ordering: true,
      order: safeOrder,
      pageLength: 10,
      lengthMenu: [[10, 25, 50, 100, -1], ['10', '25', '50', '100', 'Tất cả']],
      columnDefs: [
        {
          targets: [2, 10, 27],
          visible: false
        }
      ],
      dom: "<'row'<'col-6'l><'col-6'f>>" +
        "<'row'<'col-sm-12'tr>>" +
        "<'row'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",
      language: {
        lengthMenu: "_MENU_ ",
        zeroRecords: "Không tìm thấy",
        info: "Hiển thị _START_ đến _END_ trong _TOTAL_ dòng",
        infoEmpty: "Không có dữ liệu",
        infoFiltered: "(lọc từ _MAX_ dòng)",
        search: '<i class="fas fa-search"></i>:',
        paginate: {
          first: "Đầu",
          previous: '<i class="fas fa-chevron-left"></i>',
          next: '<i class="fas fa-chevron-right"></i>',
          last: "Cuối"
        }
      },
      footerCallback: function () {
        const api = this.api();

        // 1) Lấy danh sách tiêu đề cột
        const headersText = $(api.columns().header()).map((i, th) => $(th).text().trim()).get();

        // 2) Chuẩn hóa để so sánh không dấu
        const normalize = (s) => String(s || '')
          .toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const headersNorm = headersText.map(normalize);

        // 3) Helper tìm index theo alias tên cột
        const idxBy = (aliases) => {
          for (const name of aliases) {
            const i = headersNorm.indexOf(normalize(name));
            if (i !== -1) return i;
          }
          return -1;
        };

        // 4) Tìm các index cột cần dùng dựa trên tên header
        const idxHieuSuat = idxBy(['Hiệu suất', 'Hieu suat']);
        const idxWinFail = idxBy(['Win/Fail', 'Win-fail', 'WinFail']);
        const idxHoTen = idxBy(['Họ tên', 'Ho ten', 'Tên nhân sự', 'Ten nhan su', 'Họ và tên']);
        const idxDoKho = idxBy(['Độ khó', 'Do kho']);
        const idxChatLuong = idxBy(['Chất lượng', 'Chat luong']);

        if (idxHieuSuat < 0) return; // Không có cột số liệu -> không tính

        // 5) Helper đọc dữ liệu cột theo trang hiện tại
        const toArray = (i) => (i < 0 ? [] : api.column(i, { page: 'current' }).data().toArray());

        // 6) Tính tổng theo nhóm
        const calculateTotalByGroup = function (groupData, valueColumnIndex) {
          const groupTotals = {};
          const values = api.column(valueColumnIndex, { page: 'current' }).data().toArray();
          groupData.forEach((group, localRowIdx) => {
            const amount = Number((String(values[localRowIdx] || '')).replace(/[\$,]/g, '')) || 0;
            const key = String(group || '');
            groupTotals[key] = (groupTotals[key] || 0) + amount;
          });
          return groupTotals;
        };

        // 7) Render HTML kết quả
        const generateCardHtml = (groupTotals) => {
          let html = `<ul>`;
          Object.keys(groupTotals).forEach(group => {
            const formattedValue = groupTotals[group].toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            html += `<li>${esc(group)}: ${formattedValue}</li>`;
          });
          html += `</ul>`;
          return html;
        };

        const render = (sel, totals) => { if ($(sel).length) $(sel).html(generateCardHtml(totals)); };

        // 8) Tính và hiển thị theo từng nhóm (nếu tìm thấy cột nhóm)
        const winFailData = toArray(idxWinFail);
        if (winFailData.length) render('#winFail_Card', calculateTotalByGroup(winFailData, idxHieuSuat));

        const hoTenData = toArray(idxHoTen);
        if (hoTenData.length) render('#hoTen_Card', calculateTotalByGroup(hoTenData, idxHieuSuat));

        const doKhoData = toArray(idxDoKho);
        if (doKhoData.length) render('#doKho_Card', calculateTotalByGroup(doKhoData, idxHieuSuat));

        const chatLuongData = toArray(idxChatLuong);
        if (chatLuongData.length) render('#chatLuong_Card', calculateTotalByGroup(chatLuongData, idxHieuSuat));
      },

        const selectToHeaders = {

          '#filterkhoi': ['Khối', 'Khoi'],
