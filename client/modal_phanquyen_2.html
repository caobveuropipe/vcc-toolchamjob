<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Phân Quyền - UI Tối Ưu</title>

    <style>
        /* ------------------------------ */
        /* Tối ưu modal                   */
        /* ------------------------------ */

        #modal_phanquyen_2_Modal {
            position: absolute;
            width: 96% !important;
            height: 96% !important;
            top: 2%;
            left: 2%;
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            background: #2E3D76 !important;
            color: white !important;
            padding: 14px 20px !important;
        }

        .modal-header h5 {
            font-weight: 600;
        }

        .modal-body {
            background: #F5F7FB;
            padding: 0 !important;
        }

        /* Dòng chức năng */
        .action-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #E9EEF7;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }

        /* Dropdown */
        #modal_phanquyen_2_emailDroplist {
            width: 200px;
            /* Giảm kích thước ô chọn email */
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #D5DEEB;
        }

        /* Button */
        .btn-custom {
            padding: 6px 20px !important;
            /* Tăng padding ngang */
            border-radius: 6px !important;
            font-size: 13px !important;
            font-weight: 500;
            white-space: nowrap;
            /* Đảm bảo nội dung trên 1 dòng */
            display: flex;
            align-items: center;
            gap: 6px;
            /* Khoảng cách icon và text */
        }

        .btn-info {
            background: #00A6B2 !important;
            border: none !important;
        }

        .btn-info:hover {
            opacity: 0.85;
        }

        /* Table container */
        .table-wrapper {
            background: white;
            margin: 12px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #D5DEEB;
        }

        /* Material Design Style for Table */
        #dataTablePhanQuyen {
            border-collapse: separate !important;
            border-spacing: 0 6px !important;
        }

        #dataTablePhanQuyen thead th {
            background: #2E3D76 !important;
            color: white !important;
            text-align: left;
            padding: 12px 16px !important;
            font-weight: 600;
            border: none !important;
        }

        #dataTablePhanQuyen tbody tr {
            background: white !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            border-radius: 8px !important;
        }

        #dataTablePhanQuyen tbody tr td {
            padding: 12px 16px !important;
            border-top: none !important;
            border-bottom: none !important;
        }

        #dataTablePhanQuyen tbody tr:hover {
            transform: translateY(-2px);
            transition: 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        #dataTablePhanQuyen tbody tr td:first-child {
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        #dataTablePhanQuyen tbody tr td:last-child {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        #dataTablePhanQuyen td {
            padding: 8px !important;
            vertical-align: middle !important;
        }

        #dataTablePhanQuyen tr:hover {
            background: #F1F4FF !important;
        }

        /* Radio Group */
        .btn-group .btn {
            padding: 4px 10px !important;
        }

        .row-checkbox {
            width: 18px;
            height: 18px;
        }

        /* Hiệu ứng edit Material cho input */
        .edit-input {
            transition: all 0.25s ease;
            border: 1px solid #D0D7E2;
        }

        .edit-input:focus {
            border-color: #3F51B5 !important;
            box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.25) !important;
            background: #F8F9FF;
        }

        tr.editing-row td {
            background: #EEF1FF !important;
            transition: background 0.3s ease;
        }
    </style>
</head>

<body>

    <div class="modal fade full-screen-modal" id="modal_phanquyen_2_Modal">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">

                <!-- HEADER -->
                <div class="modal-header">
                    <h5 class="m-0">SETUP PHÂN QUYỀN</h5>
                    <button class="btn-close btn-close-white" onclick="modal_phanquyen_3_hideModal();"></button>
                </div>

                <!-- BODY -->
                <div class="modal-body">

                    <!-- Action Bar -->
                    <div class="action-bar" style="flex-wrap: nowrap;">
                        <select id="modal_phanquyen_2_emailDroplist" class="form-select text-center">
                            <option selected disabled>Chọn email</option>
                        </select>

                        <button id="modal_phanquyen_2_load" class="btn btn-info btn-custom"
                            onclick="modal_phanquyen_3_LayDuLieuVaoBang();">
                            <i class="fa-solid fa-eye"></i> Xem phân quyền
                        </button>

                        <button id="modal_phanquyen_2_submit" class="btn btn-success btn-custom"
                            onclick="modal_phanquyen_3_submit();">
                            <i class="fas fa-cloud-upload-alt"></i> Submit
                        </button>

                        <button id="modal_phanquyen_2_del" class="btn btn-danger btn-custom"
                            onclick="modal_phanquyen_3_delete();">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>

                    <!-- Table Wrapper -->
                    <div class="table-wrapper">
                        <div class="mb-2 d-flex justify-content-end">
                            <input id="tableSearchInput" type="text" class="form-control form-control-sm"
                                style="max-width:220px" placeholder="Tìm kiếm...">
                        </div>
                        <div id="modal_phanquyen_2_dataTable">
                            <!-- Template Table Structure (sẽ được JS render) -->
                            <table id="dataTablePhanQuyen" class="table table-sm table-striped table-hover align-middle"
                                style="width:100%; font-size:14px;">
                                <thead>
                                    <tr>
                                        <th>Chọn</th>
                                        <th>Tên Cơ Chế</th>
                                        <th>Phân Quyền</th>
                                        <th>Mã Nhân Sự</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- JS sẽ tự động thêm dòng -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>


    </script>
</body>

</html>
