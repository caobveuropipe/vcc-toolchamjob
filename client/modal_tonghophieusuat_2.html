<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TỔNG HỢP HIỆU SUẤT</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ccc;
      margin: 0;
      padding: 0;
    }

    .tablink {
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      background-color: #fff8dc;
      color: #004080;
      margin: 5px;
    }

    .tablink.active {
      background-color: #2E3D76;
      color: #fff;
    }

    .tabcontent {
      display: none;
      height: calc(100vh - 40px);
      /* overflow-y: auto; */
      /* padding: 10px; */
      margin: 0;
    }

    .tabcontent.active {
      display: block;
    }

    #dataTableTongHopHieuSuat {
      table-layout: auto !important;
      width: auto !important;
    }

    #dataTableTongHopHieuSuat_container {
      /* overflow-x: auto; */
      width: 100%;
    }

    #dataTableTongHopHieuSuat td,
    #dataTableTongHopHieuSuat th {
      white-space: nowrap;
    }

    #dataTableTongHopHieuSuat_container th {
      text-align: center !important;
      vertical-align: middle !important;
    }

    #dataTableTongHopHieuSuat_container td {
      text-align: center !important;
    }

    /* #dataTableTongHopHieuSuat_container td:nth-child(7) { text-align: right !important; } */
    #dataTableTongHopHieuSuat_container td:nth-child(6) {
      text-align: left !important;
    }

    #tongHopHieuSuat_Modal .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      min-height: 54px;
    }

    #tongHopHieuSuat_Modal .modal-title-compact {
      flex: 0 0 auto;
      font-size: 1rem;
      white-space: nowrap;
    }

    /* Toolbar nằm ngay trên header để dành tối đa chiều cao cho bảng. */
    #tongHopHieuSuat_Modal .toolbar-sticky {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    #tongHopHieuSuat_Modal .select2-container--open,
    #tongHopHieuSuat_Modal .select2-dropdown {
      z-index: 1080;
    }

    #tongHopHieuSuat_Modal .toolbar-sticky .form-select,
    #tongHopHieuSuat_Modal .toolbar-sticky .form-control,
    #tongHopHieuSuat_Modal .toolbar-sticky .btn {
      height: 34px;
      min-height: 34px;
      padding-top: 3px;
      padding-bottom: 3px;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    #tongHopHieuSuat_Modal .toolbar-sticky .form-select {
      width: 125px !important;
      flex: 0 0 125px;
    }

    /* Select2 tạo giao diện riêng nên cần thu gọn trực tiếp container của nó. */
    #tongHopHieuSuat_Modal .toolbar-sticky .select2-container {
      width: 112px !important;
      min-width: 112px;
      flex: 0 0 112px;
    }

    #tongHopHieuSuat_Modal .toolbar-sticky .select2-selection--single {
      height: 34px !important;
      min-height: 34px !important;
      padding: 0 26px 0 8px !important;
      font-size: 0.82rem;
    }

    #tongHopHieuSuat_Modal .toolbar-sticky .select2-selection__rendered {
      line-height: 32px !important;
      padding-left: 0 !important;
      padding-right: 4px !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #tongHopHieuSuat_Modal .toolbar-sticky .select2-selection__arrow {
      height: 32px !important;
      width: 22px !important;
    }

    #tongHopHieuSuat_Modal .toolbar-sticky .select2-selection__clear {
      margin-right: 2px !important;
      padding: 0 !important;
    }

    #tongHopHieuSuat_Modal .toolbar-sticky .form-control {
      width: 180px;
      min-width: 120px !important;
      max-width: 220px !important;
      flex: 1 1 180px !important;
    }

    #tongHopHieuSuat_Modal .toolbar-sticky button:not(.btn-light) {
      width: auto !important;
      flex: 0 0 auto;
    }

    #tongHopHieuSuat_Modal .modal-body {
      padding-top: 0;
    }

    @media (max-width: 991px) {
      #tongHopHieuSuat_Modal .modal-header {
        gap: 6px;
      }

      #tongHopHieuSuat_Modal .modal-title-compact {
        font-size: 0.85rem;
      }
    }

    /* Tránh clipping khi có dropdown của thư viện */
    .modal,
    .modal-dialog,
    .modal-content {
      overflow: visible;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="modal fade full-screen-modal" id="tongHopHieuSuat_Modal" aria-labelledby="tongHopHieuSuat"
      aria-hidden="true" data-bs-backdrop="static">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <!-- Header gọn: tiêu đề, bộ lọc và thao tác trên cùng một hàng -->
          <div class="modal-header" style="background-color: #E0FFFA;">
            <h5 class="m-0 modal-title-compact" style="color: white; font-weight: 700;">TỔNG HỢP HIỆU SUẤT</h5>
            <div class="toolbar-sticky">
              <select class="btn form-select" style="width: 150px; text-align: center; text-align-last: center;"
                id="modal_tonghophieusuat_2_thangChiTra_DropList" title="Kỳ trả lương">
                <option value="" disabled selected>Tháng chi trả</option>
              </select>

              <select class="btn form-select" style="width: 150px; text-align: center; text-align-last: center;"
                id="modal_tonghophieusuat_2_kyNghiemThu_DropList" title="Kỳ nghiệm thu">
                <option value="" disabled selected>Kỳ nghiệm thu</option>
              </select>
              <button type="button" class="btn btn-sm btn-light"
                onclick="modal_tonghophieusuat_3_taoDropDown_KyNghiemThu()" title="Làm mới kỳ nghiệm thu">
                <i class="fas fa-sync-alt"></i>
              </button>

              <select class="btn form-select"
                style="width: 150px; text-align: center; text-align-last: center; background-color: #ffffff"
                id="modal_tonghophieusuat_2_loaiThuNhap_DropList" title="Loại thu nhập">
                <option value="" disabled selected>Loại thu nhập</option>
                <option value="Chấm job">Chấm job</option>
                <option value="Nhuận">Nhuận</option>
                <option value="OKR">OKR</option>
                <option value="Chỉ tiêu DS">Chỉ tiêu DS</option>
                <option value="Thưởng dự án">Thưởng dự án</option>
              </select>

              <input type="text" class="form-control flex-grow-1" name="tongHopHieuSuat_GhiChu"
                id="tongHopHieuSuat_GhiChu" placeholder="Ghi chú" style="min-width: 150px; max-width: 400px;">

              <button id="idSumarized" type="button" class="btn btn-info btn-outline-light" style="width: 7rem;"
                onclick="pg_general_3_GetDataTongHop()" title="Tổng hợp hiệu suất">
                <i class="fa-solid fa-calculator"></i> Tính
              </button>

              <button id="savePerformance" type="button" class="btn btn-info btn-outline-light" style="width: 7rem;"
                onclick="modal_tonghophieusuat_3_LuuChiTra()" title="Submit hiệu suất vào data và tạo file trình ký">
                <i class="fa-solid fa-check"></i> Submit
              </button>

              <select class="btn form-select"
                style="width: auto; text-align: center; text-align-last: center; background-color: #ffffff"
                id="modal_tonghophieusuat_2_loaiToTrinh" title="Chọn loại tờ trình">
                <option value="" disabled selected>Tờ trình?</option>
                <option value="toTrinh_hieuSuat">HIỆU SUẤT</option>
                <option value="toTrinh_thuong">THƯỞNG</option>
              </select>

              <button id="printTotrinh" type="button" class="btn btn-info btn-outline-light" style="width: 7rem;"
                onclick="modal_totrinh_3_ShowModal()" title="In tờ trình">
                <i class="fa-solid fa-clipboard"></i> Tờ trình
              </button>

              <button id="id_Compared" type="button" class="btn btn-info btn-outline-light" style="width: 7rem;"
                onclick="modamodal_soSanh_2_showModal()" title="So sánh">
                <!-- modal_totrinh_3_compare -->
                <i class="fa-solid fa-greater-than-equal"></i> So sánh
              </button>
            </div>
            <button type="button" class="btn-close flex-shrink-0" data-bs-dismiss="modal" aria-label="Đóng"></button>
          </div>

          <!-- Modal body -->
          <div class="modal-body">

            <!-- Nội dung -->
            <div id="dataTableTongHopHieuSuat_container"></div>
            <div id="dataTableSoSanh_container"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script></script>
</body>

</html>
